stages:
  prepare:
    cmd: python3 src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/dataset.csv
    params:
      - prepare
    outs:
      - data/prepared

  train:
    cmd: python3 src/train.py
    deps:
      - src/train.py
      - data/prepared
    params:
      - train
    outs:
      - models/model.pkl

  evaluate:
    cmd: python3 src/evaluate.py
    deps:
      - src/evaluate.py
      - data/prepared
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
