# Despliegue de la API en Kubernetes: tres copias y una dirección fija para llegar a ellas.
# Cambien <usuario>/<repo> por los de GitHub, en minúsculas: es la imagen que publica su CD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/<usuario>/<repo>:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
